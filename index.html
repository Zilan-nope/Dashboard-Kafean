<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kafe Senja: POS & Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e6b52">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#eef1ec;--card:#fbfcfa;--tx:#14201b;--mu:#62706a;--ln:#dbe2dc;--pr:#1e6b52;--prt:#d9ebe2;--ok:#1e8a4f;--bad:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#17211c;--tx:#e8efe9;--mu:#92a39a;--ln:#27352e;--pr:#5fcf9e;--prt:#1d3b2e;--ok:#5fcf9e;--bad:#ff8a7a;color-scheme:dark}}
    :root[data-theme="dark"]{--bg:#101814;--card:#17211c;--tx:#e8efe9;--mu:#92a39a;--ln:#27352e;--pr:#5fcf9e;--prt:#1d3b2e;--ok:#5fcf9e;--bad:#ff8a7a;color-scheme:dark}
    *{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    [hidden]{display:none!important}
    h1{font-size:24px;font-weight:800;margin:0 0 14px}h2{font-size:15px;font-weight:600;margin:0 0 10px}
    small,.mu{color:var(--mu);font-weight:400;font-size:12px}
    #app{display:grid;grid-template-columns:195px minmax(0,1fr)}
    nav{padding:18px 10px;border-right:1px solid var(--ln);height:100%}
    .br{font-weight:800;font-size:18px;padding:0 12px 16px}
    nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:11px 12px;border-radius:10px;font:inherit;cursor:pointer}
    nav button.on{background:var(--prt);color:var(--pr);font-weight:600}
    main{padding:22px;max-width:1040px;width:100%}
    .card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
    .kpis .card{margin:0}.kpis b{display:block;font-size:20px}
    .kpis .hero{grid-column:span 2;background:var(--pr);border-color:var(--pr);color:var(--bg)}.hero .mu{color:inherit;opacity:.8}.hero b{font-size:36px;line-height:1.15;font-weight:800}
    .ok{color:var(--ok)}.bad{color:var(--bad)}.hero .ok{color:inherit}
    .g2{display:grid;grid-template-columns:3fr 2fr;gap:14px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
    .seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;margin-bottom:12px;overflow:hidden}
    button{font:inherit;cursor:pointer}.seg button{background:none;border:0;color:var(--tx);padding:7px 14px}
    .pb,.seg button.on{background:var(--pr);color:var(--bg);border:0;border-radius:9px;padding:8px 14px;font-weight:600}.seg button.on{border-radius:0}
    .qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
    .q{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:left;color:var(--tx)}.q:active{background:var(--prt)}.q span{display:block;color:var(--mu);font-size:12px}
    .tag{border:1px solid var(--ln);padding:2px 9px;border-radius:20px;font-size:12px;white-space:nowrap}
    .scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:var(--mu);font-size:12px;font-weight:400;padding-bottom:6px}td{padding:5px 6px 5px 0}
    input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px;font:inherit}input[type=checkbox]{width:20px;height:20px}
    .x{background:none;border:0;color:var(--bad);font-size:16px}
    .add-grid{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 0.8fr auto;gap:8px;margin-top:12px}
    .qrb{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin:10px 0}.qrb svg{display:block}
    .url{word-break:break-all}ul{margin:0;padding-left:18px}li{margin:6px 0}
    #toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}#toast.s{opacity:1}
    #cust{max-width:520px;margin:0 auto;padding:22px}.dim{opacity:.5}
    #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .lbox{width:100%;max-width:390px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:24px}
    .fld{margin-bottom:12px}.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
    .ubar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:14px;background:var(--card);border:1px solid var(--ln);border-radius:12px;font-size:13px}
    .bout{background:none;border:1px solid var(--ln);color:var(--bad);border-radius:8px;padding:4px 10px;font-size:12px}
    #qr-reader{width:100%;max-width:340px;margin:12px auto;border-radius:12px;overflow:hidden}
    @media(max-width:820px){
      #app{display:block}nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;height:auto;border:0;border-top:1px solid var(--ln);background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
      nav button{text-align:center;padding:10px 4px;font-size:12px}.br{display:none}main{padding:16px 16px 90px}
      .g2{grid-template-columns:1fr}.kpis .hero{grid-column:span 2}.add-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div id="login" hidden></div>
  <div id="app" hidden>
    <nav>
      <div class="br">☕ Kafe Senja</div>
      <button data-t="dash">📊 Dashboard</button>
      <button data-t="menu">📋 Menu &amp; QR</button>
      <button data-t="att">📷 Absensi QR</button>
      <button data-t="usr" id="nav-usr">👥 Akun</button>
    </nav>
    <main id="main"></main>
  </div>
  <div id="cust" hidden></div>
  <div id="toast"></div>

  <!-- Library QR Generator, QR Scanner Kamera, dan Supabase -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ==========================================
    // KONFIGURASI SUPABASE (TEMPEL ANON KEY DI SINI)
    // ==========================================
    const SUPABASE_URL = 'https://jksqjkdbyxbgogvydelr.supabase.co';
    const SUPABASE_KEY = 'TEMPEL_ANON_PUBLIC_KEY_ANDA_DI_SINI';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // UTILITAS & STATE APLIKASI
    // ==========================================
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
    const DN = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    const dl = d => d ? DN[new Date(Date.now() - d * 864e5).getDay()] : 'Hari ini';
    const todayStr = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD lokal
    const hmNow = () => { const n = new Date(); return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); };
    const mins = t => +String(t).slice(0,2) * 60 + +String(t).slice(3,5);

    let S = { menu: [], sales: [], staff: [], att: {} };
    let P = 0, tab = 'dash', TB = 5, pv = false, tt, scanner = null, scanning = false;
    let U = JSON.parse(sessionStorage.getItem('ks_user') || 'null');
    let lm = 'staff'; // 'staff' | 'admin'

    const isAdmin = () => U && (U.role === 'owner' || U.role === 'admin');
    const setU = u => {
      U = u;
      u ? sessionStorage.setItem('ks_user', JSON.stringify(u)) : sessionStorage.removeItem('ks_user');
      checkPendingScan();
      render();
    };
    const toast = m => {
      const t = $('#toast'); t.textContent = m; t.classList.add('s');
      clearTimeout(tt); tt = setTimeout(() => t.classList.remove('s'), 2400);
    };

    // Token QR Absensi Harian (berubah setiap hari agar anti titip absen)
    const dailyAbsenToken = () => 'ABSEN-' + todayStr() + '-KAFESENJA';
    const absenScanUrl = () => location.href.split('#')[0] + '#scan-' + dailyAbsenToken();

    // ==========================================
    // SINKRONISASI DATA DARI SUPABASE
    // ==========================================
    async function loadAllData() {
      if (SUPABASE_KEY.includes('TEMPEL_ANON')) {
        toast('Isi SUPABASE_KEY di index.html terlebih dahulu!');
        return;
      }
      const weekAgo = new Date(Date.now() - 6 * 864e5).toISOString();
      const [mRes, pRes, sRes, aRes] = await Promise.all([
        db.from('menus').select('*').order('id', { ascending: true }),
        db.from('profiles').select('*').eq('is_active', true).order('full_name'),
        db.from('sales').select('*').gte('created_at', weekAgo),
        db.from('attendances').select('*').eq('work_date', todayStr())
      ]);

      if (mRes.error) { toast('Gagal memuat DB: ' + mRes.error.message); return; }

      S.menu = (mRes.data || []).map(m => ({
        id: m.id, name: m.name, cat: m.category, price: m.price, cost: m.cost, stock: m.stock, on: m.is_available
      }));
      S.staff = pRes.data || [];

      const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
      S.sales = (sRes.data || []).map(x => {
        const diffDays = Math.max(0, Math.floor((todayMidnight - new Date(x.created_at).setHours(0,0,0,0)) / 864e5));
        return { d: Math.min(6, diffDays), id: x.menu_id, q: x.qty, price: x.unit_price, cost: x.unit_cost };
      });

      S.att = {};
      (aRes.data || []).forEach(a => {
        S.att[a.user_id] = { in: a.clock_in ? a.clock_in.slice(0,5) : null, out: a.clock_out ? a.clock_out.slice(0,5) : null };
      });

      checkPendingScan();
      render();
    }

    // ==========================================
    // LOGIKA ABSENSI SCAN QR
    // ==========================================
    async function processQrAttendance(scannedText) {
      const expected = dailyAbsenToken();
      if (!scannedText || !scannedText.includes(expected)) {
        toast('QR Absensi tidak valid atau sudah kedaluwarsa!');
        return;
      }
      if (!U) {
        sessionStorage.setItem('ks_pending_scan', scannedText);
        toast('Silakan login dulu untuk mencatat absensi');
        render();
        return;
      }

      const now = hmNow();
      const existing = S.att[U.id];

      if (!existing || !existing.in) {
        // Scan Masuk
        const { error } = await db.from('attendances').upsert({
          user_id: U.id, work_date: todayStr(), clock_in: now
        }, { onConflict: 'user_id,work_date' });
        if (error) return toast('Gagal absen masuk: ' + error.message);
        toast('Absen MASUK tercatat pukul ' + now);
      } else if (!existing.out) {
        // Jeda minimal 2 menit agar tidak double-scan tidak sengaja
        if (mins(now) - mins(existing.in) < 2) {
          toast('Anda baru saja absen masuk pukul ' + existing.in);
          return;
        }
        // Scan Pulang
        const { error } = await db.from('attendances')
          .update({ clock_out: now })
          .eq('user_id', U.id)
          .eq('work_date', todayStr());
        if (error) return toast('Gagal absen pulang: ' + error.message);
        toast('Absen PULANG tercatat pukul ' + now);
      } else {
        toast('Absensi hari ini sudah lengkap (' + existing.in + ' - ' + existing.out + ')');
      }

      await stopScanner();
      await loadAllData();
    }

    function checkPendingScan() {
      const hash = location.hash;
      if (hash.startsWith('#scan-')) {
        const token = hash.slice(6);
        history.replaceState(null, '', location.pathname);
        if (U) processQrAttendance(token);
        else sessionStorage.setItem('ks_pending_scan', token);
      } else if (U && sessionStorage.getItem('ks_pending_scan')) {
        const token = sessionStorage.getItem('ks_pending_scan');
        sessionStorage.removeItem('ks_pending_scan');
        processQrAttendance(token);
      }
    }

    async function startScanner() {
      scanning = true;
      render();
      setTimeout(async () => {
        try {
          scanner = new Html5Qrcode('qr-reader');
          await scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (decodedText) => { processQrAttendance(decodedText); },
            () => {}
          );
        } catch (err) {
          scanning = false;
          toast('Kamera tidak dapat diakses: ' + err);
          render();
        }
      }, 100);
    }

    async function stopScanner() {
      if (scanner) {
        try { await scanner.stop(); scanner.clear(); } catch (e) {}
        scanner = null;
      }
      scanning = false;
    }

    // ==========================================
    // KOMPONEN TAMPILAN (VIEWS)
    // ==========================================
    const M = id => S.menu.find(m => m.id === id);
    const isLate = s => { const a = S.att[s.id]; return a && a.in && mins(a.in) > mins(s.shift_start || '08:00') + 10; };
    const k = (a,b,c='',h='') => `<div class="card ${h}"><span class="mu">${a}</span><b class="${c}">${b}</b></div>`;

    function qrSvg(u, size = 5) {
      try { const q = qrcode(0, 'M'); q.addData(u); q.make(); return q.createSvgTag(size, 2); }
      catch (e) { return '<p class="mu">QR gagal dibuat.</p>'; }
    }

    function stats(p) {
      let rev = 0, cost = 0, qty = 0;
      const day = Array(7).fill(0), by = {};
      S.sales.forEach(s => {
        day[s.d] += (s.price || 0) * s.q;
        if (p || s.d === 0) {
          rev += (s.price || 0) * s.q;
          cost += (s.cost || 0) * s.q;
          qty += s.q;
          if (s.id) by[s.id] = (by[s.id] || 0) + s.q;
        }
      });
      return { rev, profit: rev - cost, qty, day, top: Object.entries(by).sort((a,b) => b[1] - a[1]).slice(0,5) };
    }

    function chart(day) {
      const mx = Math.max(...day, 1);
      return '<svg viewBox="0 0 320 140" style="width:100%">' + [6,5,4,3,2,1,0].map((d,i) => {
        const h = day[d] / mx * 90, x = 8 + i * 45;
        return `<rect x="${x}" y="${112-h}" width="32" height="${h}" rx="6" style="fill:${d?'var(--prt)':'var(--pr)'}"/><text x="${x+16}" y="${106-h}" text-anchor="middle" font-size="9" style="fill:var(--tx)">${Math.round(day[d]/1000)}k</text><text x="${x+16}" y="130" text-anchor="middle" font-size="9" style="fill:var(--mu)">${dl(d)}</text>`;
      }).join('') + '</svg>';
    }

    function aiText() {
      const w = stats(1), L = [], t = w.top[0];
      if (t && M(+t[0])) L.push(`Terlaris 7 hari: <b>${esc(M(+t[0]).name)}</b> (${t[1]} terjual).`);
      const bm = [...S.menu].filter(m => m.price > 0).sort((a,b) => (b.price-b.cost)/b.price - (a.price-a.cost)/a.price)[0];
      if (bm) L.push(`Margin tertinggi: <b>${esc(bm.name)}</b> (${Math.round((bm.price-bm.cost)/bm.price*100)}%).`);
      const low = S.menu.filter(m => m.stock <= 10);
      if (low.length) L.push(`Segera restock: ${low.map(m => esc(m.name)).join(', ')}.`);
      const late = S.staff.filter(s => s.role === 'staff' && isLate(s)).map(s => esc(s.full_name));
      if (late.length) L.push(`Terlambat hari ini: ${late.join(', ')}.`);
      return '<ul>' + (L.length ? L.map(x => '<li>' + x + '</li>').join('') : '<li>Operasional berjalan normal.</li>') + '</ul>';
    }

    function loginV() {
      const staffs = S.staff.filter(s => s.role === 'staff');
      const admins = S.staff.filter(s => s.role === 'owner' || s.role === 'admin');
      return `<div class="lbox">
        <h1 style="margin-bottom:4px">☕ Kafe Senja</h1>
        <p class="mu" style="margin:0 0 16px">Masuk sesuai akun operasional Anda</p>
        <div class="seg" style="width:100%">
          <button style="flex:1" data-lm="staff" class="${lm==='staff'?'on':''}">Karyawan (PIN)</button>
          <button style="flex:1" data-lm="admin" class="${lm==='admin'?'on':''}">Owner / Admin</button>
        </div>
        ${lm === 'staff' ? `
          <div class="fld"><label>Pilih Nama Karyawan</label>
            <select id="ls">${staffs.map(s => `<option value="${s.id}">${esc(s.full_name)} (${esc(s.position)})</option>`).join('')}</select>
          </div>
          <div class="fld"><label>PIN Login <small>(Default: 1111 / 2222)</small></label>
            <input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
          </div>
          <button class="pb" style="width:100%" id="do-login">Masuk Shift</button>
        ` : `
          <div class="fld"><label>Akun Owner / Admin</label>
            <select id="la">${admins.map(a => `<option value="${a.id}">${esc(a.full_name)} (${esc(a.email || a.position)})</option>`).join('')}</select>
          </div>
          <div class="fld"><label>Password <small>(Default: admin123)</small></label>
            <input id="lw" type="password" placeholder="••••••••">
          </div>
          <button class="pb" style="width:100%" id="do-login">Masuk Owner / Admin</button>
        `}
      </div>`;
    }

    function dashV() {
      const adm = isAdmin(), st = stats(adm ? P : 0), low = S.menu.filter(m => m.stock <= 10);
      return `<div class="ubar"><div><b>${esc(U.full_name)}</b> <span class="tag">${esc(U.position)}</span></div><button class="bout" data-logout="1">Keluar</button></div>
      <h1>Dashboard</h1>
      ${adm ? `<div class="seg"><button data-p="0" class="${P?'':'on'}">Hari ini</button><button data-p="1" class="${P?'on':''}">7 hari</button></div>` : ''}
      <div class="kpis">
        ${adm ? k('Untung ' + (P ? '7 hari' : 'hari ini'), rp(st.profit), '', 'hero') : ''}
        ${k('Omzet ' + (adm && P ? '7 hari' : 'hari ini'), rp(st.rev))}
        ${k('Item terjual', st.qty)}
        ${k('Stok menipis', low.length, low.length ? 'bad' : '')}
      </div>
      ${adm ? `<div class="g2"><div class="card"><h2>Omzet 7 hari</h2>${chart(st.day)}</div><div class="card"><h2>Menu terlaris</h2>${st.top.map(([id,q],i) => `<div class="row"><span>${i+1}. ${esc(M(+id)?.name || 'Menu')}</span><b>${q}</b></div>`).join('') || '<p class="mu">Belum ada penjualan.</p>'}</div></div>` : ''}
      <div class="card"><h2>Kasir cepat <small>ketuk menu untuk mencatat 1 penjualan</small></h2>
        <div class="qs">${S.menu.filter(m => m.on).map(m => `<button class="q" data-sell="${m.id}"><b>${esc(m.name)}</b><span>${rp(m.price)}, sisa ${m.stock}</span></button>`).join('')}</div>
      </div>
      <div class="g2">
        ${adm ? `<div class="card"><h2>Ringkasan AI</h2>${aiText()}</div>` : ''}
        <div class="card"><h2>Perlu restock</h2>${low.map(m => `<div class="row"><span>${esc(m.name)} <small>sisa ${m.stock}</small></span><button class="pb" data-rs="${m.id}">+10</button></div>`).join('') || '<p class="mu">Semua stok aman.</p>'}</div>
      </div>`;
    }

    function menuV() {
      const adm = isAdmin();
      const u = location.href.split('#')[0] + '#menu-' + TB;
      return `<h1>Menu &amp; QR Meja</h1>
      <div class="g2">
        <div class="card">
          <h2>${adm ? 'Kelola Menu (Owner / Admin)' : 'Daftar Menu &amp; Stok'}</h2>
          ${adm ? `
            <div class="scroll">
              <table>
                <tr><th>Nama Menu</th><th>Kategori</th><th>Harga Jual</th><th>HPP (Modal)</th><th>Stok</th><th>Ada</th><th></th></tr>
                ${S.menu.map(m => `<tr>
                  <td><input data-f="name" data-id="${m.id}" value="${esc(m.name)}"></td>
                  <td><select data-f="category" data-id="${m.id}">${['Kopi','Non-kopi','Makanan','Lainnya'].map(c => `<option ${m.cat===c?'selected':''}>${c}</option>`).join('')}</select></td>
                  <td><input type="number" min="0" step="500" data-f="price" data-id="${m.id}" value="${m.price}"></td>
                  <td><input type="number" min="0" step="500" data-f="cost" data-id="${m.id}" value="${m.cost}"></td>
                  <td><input type="number" min="0" data-f="stock" data-id="${m.id}" value="${m.stock}"></td>
                  <td><input type="checkbox" data-f="is_available" data-id="${m.id}" ${m.on?'checked':''}></td>
                  <td><button class="x" data-del="${m.id}" title="Hapus menu">✕</button></td>
                </tr>`).join('')}
              </table>
            </div>
            <h2 style="margin-top:16px">Tambah Menu Baru</h2>
            <div class="add-grid">
              <input id="nn" placeholder="Nama menu baru">
              <select id="nc"><option>Kopi</option><option>Non-kopi</option><option>Makanan</option><option>Lainnya</option></select>
              <input id="np" type="number" placeholder="Harga jual">
              <input id="nh" type="number" placeholder="HPP / Modal">
              <input id="ns" type="number" placeholder="Stok" value="20">
              <button class="pb" id="add">Tambah</button>
            </div>
          ` : `
            <p class="mu">Hanya akun Owner atau Admin yang dapat mengubah harga dan daftar menu.</p>
            ${S.menu.map(m => `<div class="row"><div><b>${esc(m.name)}</b> <span class="tag">${esc(m.cat)}</span></div><div><b>${rp(m.price)}</b> <small>(sisa ${m.stock})</small></div></div>`).join('')}
          `}
        </div>
        <div class="card">
          <h2>QR Menu Pelanggan</h2>
          <select id="tb">${Array.from({length:12}, (_,i) => `<option value="${i+1}" ${i+1==TB?'selected':''}>Meja ${i+1}</option>`).join('')}</select>
          <div class="qrb">${qrSvg(u, 5)}</div>
          <p class="mu url">${esc(u)}</p>
          <button class="pb" id="pv">Lihat tampilan pelanggan</button>
        </div>
      </div>`;
    }

    function attV() {
      const adm = isAdmin();
      const staffs = S.staff.filter(s => s.role === 'staff');
      const hadir = staffs.filter(s => (S.att[s.id] || {}).in).length;
      const terlambat = staffs.filter(isLate).length;
      const myAtt = S.att[U.id] || {};

      return `<h1>Absensi Scan QR</h1>
      ${adm ? `
        <div class="kpis">${k('Hadir', hadir + ' dari ' + staffs.length)}${k('Terlambat', terlambat, terlambat ? 'bad' : '')}${k('Belum masuk', staffs.length - hadir)}</div>
        <div class="g2">
          <div class="card">
            <h2>QR Absensi Kafe Hari Ini (${todayStr()})</h2>
            <p class="mu">Tampilkan QR ini di layar kasir agar karyawan memindainya saat datang dan pulang.</p>
            <div class="qrb">${qrSvg(absenScanUrl(), 5)}</div>
            <p class="mu">Kode berganti otomatis setiap hari untuk mencegah titip absen.</p>
          </div>
          <div class="card">
            <h2>Rekap Kehadiran Karyawan</h2>
            ${staffs.map(s => {
              const a = S.att[s.id] || {}, late = isLate(s);
              return `<div class="row">
                <div><b>${esc(s.full_name)}</b><br><span class="mu">${esc(s.position)}, shift ${String(s.shift_start).slice(0,5)}</span></div>
                <div>${a.in ? `<span class="tag ${late?'bad':'ok'}">${late?'Terlambat':'Tepat waktu'} ${a.in}${a.out?' - '+a.out:''}</span>` : '<span class="tag">Belum scan</span>'}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      ` : `
        <div class="card">
          <h2>Status Absensi Anda Hari Ini (${todayStr()})</h2>
          <div class="row">
            <div><b>${esc(U.full_name)}</b><br><span class="mu">Shift ${String(U.shift_start || '08:00').slice(0,5)}</span></div>
            <div>${myAtt.in ? `<span class="tag ok">Masuk ${myAtt.in}${myAtt.out ? ' • Pulang ' + myAtt.out : ''}</span>` : '<span class="tag">Belum absen</span>'}</div>
          </div>
          <div style="margin-top:14px">
            ${!scanning ? `<button class="pb" id="btn-scan">📷 Scan QR Absensi di Kasir</button>` : `<button class="bout" id="btn-stop-scan">Tutup Kamera</button><div id="qr-reader"></div>`}
          </div>
          <p class="mu" style="margin-top:10px">Arahkan kamera ke QR Code Absensi yang tampil di layar kasir untuk mencatat jam masuk atau pulang.</p>
        </div>
      `}`;
    }

    function usrV() {
      return `<h1>Kelola Akun &amp; Role</h1>
      <div class="g2">
        <div class="card"><h2>Daftar Pengguna</h2>
          ${S.staff.map(s => `<div class="row">
            <div><b>${esc(s.full_name)}</b> <span class="tag">${esc(s.role.toUpperCase())}</span><br>
            <span class="mu">${esc(s.position)} • Shift ${String(s.shift_start).slice(0,5)} ${s.role==='staff' ? '• PIN: '+esc(s.pin_code) : '• '+esc(s.email)}</span></div>
            ${s.id !== U.id ? `<button class="x" data-delstaff="${s.id}">✕</button>` : ''}
          </div>`).join('')}
        </div>
        <div class="card"><h2>Tambah Akun Baru</h2>
          <div class="fld"><label>Nama Lengkap</label><input id="sn" placeholder="Contoh: Andi"></div>
          <div class="fld"><label>Hak Akses (Role)</label>
            <select id="srole"><option value="staff">Karyawan (Kasir / Scan QR)</option><option value="admin">Admin (Bisa Ubah Menu)</option></select>
          </div>
          <div class="fld"><label>Posisi</label><select id="sr"><option>Barista</option><option>Kasir</option><option>Dapur</option><option>Admin</option></select></div>
          <div class="fld"><label>Jam Shift</label><input id="ss" type="time" value="08:00"></div>
          <div class="fld"><label>PIN Karyawan (4 digit)</label><input id="sp" type="text" inputmode="numeric" maxlength="6" placeholder="5555"></div>
          <div class="fld"><label>Email &amp; Password <small>(Khusus jika Role = Admin)</small></label>
            <input id="sem" type="email" placeholder="admin2@kafesenja.id" style="margin-bottom:6px">
            <input id="spw" type="text" placeholder="Password admin">
          </div>
          <button class="pb" id="add-staff">Simpan Akun</button>
        </div>
      </div>`;
    }

    function cust(t) {
      const cs = [...new Set(S.menu.filter(m => m.on).map(m => m.cat))];
      return `${pv ? '<button id="back" class="pb">Kembali ke dashboard</button>' : ''}<h1 style="margin-top:14px">☕ Kafe Senja</h1><p class="mu">${t ? 'Meja ' + esc(t) + ', ' : ''}menu hari ini</p>` +
        cs.map(c => `<h2 style="margin-top:18px">${esc(c)}</h2>` + S.menu.filter(m => m.on && m.cat === c).map(m => `<div class="row ${m.stock<=0?'dim':''}"><span>${esc(m.name)}</span><b>${m.stock<=0?'Habis':rp(m.price)}</b></div>`).join('')).join('');
    }

    function render() {
      const h = location.hash, isCust = /^#menu/.test(h);
      $('#cust').hidden = !isCust;
      if (isCust) {
        $('#app').hidden = true; $('#login').hidden = true;
        $('#cust').innerHTML = cust(h.slice(6).replace(/^-/, ''));
        return;
      }
      $('#login').hidden = !!U;
      $('#app').hidden = !U;
      if (!U) { $('#login').innerHTML = loginV(); return; }

      $('#nav-usr').hidden = !isAdmin();
      if (tab === 'usr' && !isAdmin()) tab = 'dash';
      $('#main').innerHTML = { dash: dashV, menu: menuV, att: attV, usr: usrV }[tab]();
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    }

    // ==========================================
    // AKSI DATABASE (CRUD KE SUPABASE)
    // ==========================================
    async function sell(id) {
      const m = M(id);
      if (!m || m.stock <= 0) return toast((m?.name || 'Menu') + ' sudah habis');
      const [uRes, sRes] = await Promise.all([
        db.from('menus').update({ stock: m.stock - 1 }).eq('id', id),
        db.from('sales').insert({ menu_id: id, qty: 1, unit_price: m.price, unit_cost: m.cost, cashier_id: U.id })
      ]);
      if (uRes.error || sRes.error) return toast('Gagal mencatat penjualan');
      toast('Tercatat: ' + m.name);
      await loadAllData();
    }

    async function addMenu() {
      const name = $('#nn').value.trim(), category = $('#nc').value;
      const price = +$('#np').value, cost = +$('#nh').value || Math.round(price * 0.4), stock = +$('#ns').value || 20;
      if (!name || !price) return toast('Isi nama dan harga jual dulu');
      const { error } = await db.from('menus').insert({ name, category, price, cost, stock, is_available: true });
      if (error) return toast('Gagal menambah menu: ' + error.message);
      toast('Menu ' + name + ' ditambahkan');
      await loadAllData();
    }

    // ==========================================
    // EVENT LISTENERS
    // ==========================================
    document.addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return;
      const d = b.dataset;

      if (d.t) { await stopScanner(); tab = d.t; render(); }
      else if (d.p !== undefined) { P = +d.p; render(); }
      else if (d.sell) await sell(+d.sell);
      else if (d.rs) {
        const m = M(+d.rs);
        await db.from('menus').update({ stock: m.stock + 10 }).eq('id', m.id);
        toast('Stok ' + m.name + ' +10'); await loadAllData();
      }
      else if (d.del) {
        if (!confirm('Hapus menu ini?')) return;
        await db.from('menus').delete().eq('id', +d.del);
        toast('Menu dihapus'); await loadAllData();
      }
      else if (b.id === 'add') await addMenu();
      else if (b.id === 'pv') { pv = true; location.hash = 'menu-' + TB; }
      else if (b.id === 'back') { pv = false; location.hash = ''; }
      else if (d.lm) { lm = d.lm; render(); }
      else if (d.logout) { await stopScanner(); setU(null); }
      else if (b.id === 'do-login') {
        if (lm === 'staff') {
          const s = S.staff.find(x => x.id === $('#ls').value);
          if (!s || s.pin_code !== $('#lp').value.trim()) return toast('PIN karyawan salah!');
          setU(s);
        } else {
          const a = S.staff.find(x => x.id === $('#la').value);
          if (!a || a.password !== $('#lw').value) return toast('Password Owner/Admin salah!');
          setU(a);
        }
      }
      else if (b.id === 'btn-scan') await startScanner();
      else if (b.id === 'btn-stop-scan') { await stopScanner(); render(); }
      else if (b.id === 'add-staff') {
        const full_name = $('#sn').value.trim(), role = $('#srole').value, position = $('#sr').value;
        const shift_start = $('#ss').value, pin_code = $('#sp').value.trim();
        const email = $('#sem').value.trim() || null, password = $('#spw').value.trim() || null;
        if (!full_name) return toast('Isi nama lengkap');
        if (role === 'staff' && pin_code.length < 4) return toast('Isi PIN minimal 4 digit');
        if (role === 'admin' && (!email || !password)) return toast('Admin wajib memiliki email & password');
        const { error } = await db.from('profiles').insert({ full_name, role, position, shift_start, pin_code, email, password });
        if (error) return toast('Gagal menyimpan akun: ' + error.message);
        toast('Akun ' + full_name + ' berhasil dibuat');
        await loadAllData();
      }
      else if (d.delstaff) {
        await db.from('profiles').update({ is_active: false }).eq('id', d.delstaff);
        toast('Akun dinonaktifkan'); await loadAllData();
      }
    });

    // Simpan otomatis perubahan menu saat Owner/Admin mengedit kolom tabel
    document.addEventListener('change', async e => {
      const t = e.target;
      if (t.id === 'tb') { TB = +t.value; render(); return; }
      const f = t.dataset.f;
      if (!f || !isAdmin()) return;
      const id = +t.dataset.id;
      const val = f === 'is_available' ? t.checked : (f === 'name' || f === 'category') ? t.value.trim() : Math.max(0, +t.value || 0);
      const { error } = await db.from('menus').update({ [f]: val }).eq('id', id);
      if (error) return toast('Gagal menyimpan menu: ' + error.message);
      toast('Perubahan menu disimpan');
      await loadAllData();
    });

    addEventListener('hashchange', render);

    // Registrasi Service Worker PWA & Muat Data Awal
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    loadAllData();
  </script>
</body>
</html>
